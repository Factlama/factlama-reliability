[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factlama-reliability"
version = "0.1.0"
description = "FactLama Reliability Engine: claims, evidence, judges, verification, scoring and policy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "FactLama Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
]
nli = [
    "transformers>=4.36.0",
    "torch>=2.1.0",
]
all = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["schemas", "core", "judges"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.isort]
known-first-party = ["schemas", "core", "judges"]
