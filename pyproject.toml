[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factlama-reliability"
version = "0.1.0"
description = "FactLama Reliability Engine: claims, evidence, judges, verification, scoring and policy"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "FactLama Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    # G5 (ADR-019): PostgreSQL is Reliability's shipped/tested persistence
    # backend, not an optional judge-provider extra like embeddings/nli --
    # every deployment needs jobs/idempotency/evaluations/outbox storage.
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "import-linter>=2.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20",
    "types-jsonschema>=4.20",
    # ADR-019 SS4: the storage conformance suite must run against a real
    # database instance, not mocks. testcontainers launches/tears down a
    # throwaway Postgres via the local Docker daemon (present by default on
    # GitHub Actions ubuntu-latest runners) so no CI service block or
    # developer-managed Postgres install is required.
    "testcontainers[postgres]>=4.0.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
]
embeddings = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
]
nli = [
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
]
all = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["schemas", "core", "judges", "api", "storage", "worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
# CI checks out factlama-architecture as a subdirectory (actions/checkout
# cannot place it outside $GITHUB_WORKSPACE) solely to read contracts/v0.1's
# fixtures; this repo's lint/format rules do not apply to that repo's own code.
extend-exclude = ["factlama-architecture"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
# E501 (line-too-long) is redundant with the formatter for real code, and
# noisy for the regex literals in core/claims.py that cannot be usefully
# wrapped; ruff format still keeps normal code lines within line-length.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["schemas", "core", "judges", "api", "storage", "worker"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# F10 of the 2026-09-21 G0-G4 validation report: this was "3.10" (this
# project's actual `requires-python` floor) until numpy's installed stub
# (numpy>=2.1, a transitive dependency of sentence-transformers, never
# imported directly by this repo's own code) started using a PEP 695 `type`
# statement mypy refuses to *parse* -- not type-check, parse -- under a
# pre-3.12 target ("Type statement is only supported in Python 3.12 and
# greater"), aborting the entire mypy run outright with no way to route
# around it: neither `ignore_missing_imports` (numpy IS installed, never
# "missing") nor `follow_imports = "skip"` on numpy/its importers prevents
# mypy from still parsing an installed module's stub file when building the
# import graph (confirmed by direct reproduction:
# https://github.com/python/mypy issue-tracker territory, not a
# misconfiguration on this repo's side), and mypy has no per-module
# `python_version` override. Bumping the *mypy* target to 3.12 does not
# relax this repo's actual `requires-python = ">=3.10"` support: mypy's
# `python_version` only selects which syntax/typeshed mypy accepts while
# type-checking, not what the 3.10/3.11/3.12 CI matrix's own real
# interpreters execute -- a genuine 3.12-only construct in this repo's own
# code would still fail immediately at collection time under the CI
# matrix's 3.10 job, which remains the authoritative check for that.
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true

# The embeddings/nli extras are optional; their vendor stubs are not required
# for the default install, so unresolved imports there are expected, not an
# error -- these modules are only reachable through judges/providers.py's
# lazy _get_model() imports, never at module load time. Also keeps mypy from
# deep-checking these large vendor stub packages themselves.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "transformers.*", "torch.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

# asyncpg ships no official inline types/stub package (unlike sqlalchemy and
# alembic, both PEP 561-compliant); it is only imported by
# storage/postgres/engine.py as the async driver string/DBAPI target for
# SQLAlchemy, never called directly by domain code.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["schemas", "core", "judges", "api", "storage", "worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "schemas is a pure data layer with no internal dependencies"
type = "forbidden"
source_modules = ["schemas"]
forbidden_modules = ["core", "judges", "api", "storage", "worker"]

[[tool.importlinter.contracts]]
name = "domain code (schemas, core) must not import a vendor model SDK directly (ADR-004)"
type = "forbidden"
source_modules = ["schemas", "core"]
forbidden_modules = ["sentence_transformers", "transformers", "torch", "openai", "anthropic"]

[[tool.importlinter.contracts]]
# api and worker are peer top-level orchestration layers (ADR-019 SS3:
# "API handlers, worker orchestration, and core services consume ports").
# Neither may be imported by domain code underneath them.
name = "api and worker are outermost layers; domain code (schemas, core, judges) must not import either"
type = "forbidden"
source_modules = ["schemas", "core", "judges"]
forbidden_modules = ["api", "worker"]

[[tool.importlinter.contracts]]
# ADR-019 SS2: storage.backend is the Protocol every adapter (Postgres
# today, an operator-supplied engine post-MVP) must satisfy without leaking
# vendor transaction objects, SQL, or driver exceptions through its public
# signatures -- so the protocol layer itself cannot import the vendor
# libraries it is meant to keep out of everyone else's way either.
name = "storage.backend/errors/models are a pure protocol layer with no vendor imports"
type = "forbidden"
source_modules = ["storage.backend", "storage.errors", "storage.models"]
forbidden_modules = ["sqlalchemy", "asyncpg", "alembic"]

[[tool.importlinter.contracts]]
# ADR-019 SS3: "API handlers, worker orchestration, and core services
# consume ports; they do not import concrete backend implementations."
# G5's async API (PR2) and worker (PR3) depend on storage.backend only;
# api.bootstrap and worker.bootstrap are the two designated composition-root
# modules, each exempted below.
name = "domain code, api and worker must depend on storage.backend, not the concrete storage.postgres adapter"
type = "forbidden"
source_modules = ["schemas", "core", "judges", "api", "worker"]
forbidden_modules = ["storage.postgres"]
ignore_imports = [
    "api.bootstrap -> storage.postgres.backend",
    "api.bootstrap -> storage.postgres.engine",
    "worker.bootstrap -> storage.postgres.backend",
    "worker.bootstrap -> storage.postgres.engine",
]
