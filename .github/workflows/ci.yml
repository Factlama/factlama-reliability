name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # F10 of the 2026-09-21 G0-G4 validation report: this was previously
      # unpinned (defaulting to factlama-architecture's own default branch
      # HEAD at CI-run time), so the same reliability commit could validate
      # against a different, possibly incompatible contracts/v0.1 revision
      # on different days. Pinned to a known-compatible commit; bump this
      # `ref` deliberately (in the same PR as any contract-affecting change)
      # rather than letting it drift silently.
      - name: Checkout factlama-architecture (canonical contracts/v0.1 fixtures)
        uses: actions/checkout@v4
        with:
          repository: Factlama/factlama-architecture
          ref: e2a022e8187e72708a224ac29d5cc8575b004af2
          path: factlama-architecture

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy schemas core judges api storage

      - name: Dependency-boundary check (import-linter)
        run: lint-imports

      # G5 (ADR-019 SS4): tests/conformance/ needs a real PostgreSQL instance,
      # not mocks. testcontainers launches/tears down its own throwaway
      # container via the Docker daemon ubuntu-latest runners already have --
      # no `services:` block needed. If a runner's socket path ever needs the
      # same workaround this repo's contributors hit on macOS Docker Desktop,
      # set TESTCONTAINERS_RYUK_DISABLED=true here.
      - name: Tests (pytest), including the G0 contract fixture suite and G5 storage conformance
        run: pytest --cov=schemas --cov=core --cov=judges --cov=api --cov=storage --cov-report=term-missing
        env:
          FACTLAMA_CONTRACTS_DIR: ${{ github.workspace }}/factlama-architecture/contracts/v0.1
