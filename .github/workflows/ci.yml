name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # F10 of the 2026-09-21 G0-G4 validation report: this was previously
      # unpinned (defaulting to factlama-architecture's own default branch
      # HEAD at CI-run time), so the same reliability commit could validate
      # against a different, possibly incompatible contracts/v0.1 revision
      # on different days. Pinned to a known-compatible commit; bump this
      # `ref` deliberately (in the same PR as any contract-affecting change)
      # rather than letting it drift silently.
      - name: Checkout factlama-architecture (canonical contracts/v0.1 fixtures)
        uses: actions/checkout@v4
        with:
          repository: Factlama/factlama-architecture
          ref: e2a022e8187e72708a224ac29d5cc8575b004af2
          path: factlama-architecture

      # 2026-10-23 G6 review, stage 1 (baseline): tests/conformance/test_outbox_cross_repo_delivery.py
      # previously skipped silently whenever this sibling checkout was
      # absent, which made CI's run of the one required integration test
      # for the "Reliability outbox -> Observability ingress" handoff
      # (EXECUTION_PLAN.md's "Cross-repository handoffs" table) a no-op
      # without ever failing. Pinned to a known-compatible commit for the
      # same reason the factlama-architecture checkout above is pinned;
      # bump this `ref` deliberately alongside any contract-affecting
      # change to either repo's outbox/ingress wire shape.
      - name: Checkout factlama-observability (G6 cross-repo delivery handoff)
        uses: actions/checkout@v4
        with:
          repository: Factlama/factlama-observability
          ref: 50b4bce99bbd67291507f1811ee9d32256a3f802
          path: factlama-observability

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Provision factlama-observability venv (for the cross-repo delivery test)
        run: |
          python -m venv factlama-observability/.venv
          factlama-observability/.venv/bin/pip install -e "./factlama-observability[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy schemas core judges api storage worker

      - name: Dependency-boundary check (import-linter)
        run: lint-imports

      # G5 (ADR-019 SS4): tests/conformance/ needs a real PostgreSQL instance,
      # not mocks. testcontainers launches/tears down its own throwaway
      # container via the Docker daemon ubuntu-latest runners already have --
      # no `services:` block needed. If a runner's socket path ever needs the
      # same workaround this repo's contributors hit on macOS Docker Desktop,
      # set TESTCONTAINERS_RYUK_DISABLED=true here.
      - name: Tests (pytest), including the G0 contract fixture suite and G5 storage/worker conformance
        run: pytest --cov=schemas --cov=core --cov=judges --cov=api --cov=storage --cov=worker --cov-report=term-missing
        env:
          FACTLAMA_CONTRACTS_DIR: ${{ github.workspace }}/factlama-architecture/contracts/v0.1
          FACTLAMA_OBSERVABILITY_REPO_DIR: ${{ github.workspace }}/factlama-observability
